{% extends 'base.html' %}
{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <h1 class="display-4 fw-bold text-center mb-5 animate-on-scroll">Join Our Team</h1>
        <div class="row g-4">
            {% for career in careers %}
            <div class="col-md-6 animate-on-scroll">
                <div class="card">
                    <div class="card-body">
                        <h5>{{ career.title }}</h5>
                        <p><i class="fas fa-building me-2"></i>{{ career.department }}</p>
                        <p><i class="fas fa-map-marker-alt me-2"></i>{{ career.location }}</p>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center"><p>No positions available.</p></div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
