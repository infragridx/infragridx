{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Partner Login | InfraGridX{% endblock %}

{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 animate-on-scroll">
                <h1 class="display-4 fw-bold mb-4">Partner Login</h1>
                <p class="text-muted mb-4">Access your partner dashboard</p>
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Not yet registered? <a href="{% url 'core:partner_register' %}">Register Now</a></p>
                            <p><a href="{% url 'core:home' %}">← Back to Home</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
